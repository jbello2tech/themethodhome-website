<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Review Moderation</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<style>
  :root{
    --ground:#F3F3F1; --surface-raised:#FFFFFF; --ink:#111111; --ink-soft:#68686A;
    --accent-deep:#0D0D0D; --line:#DEDEDC; --radius:12px;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--ground); color:var(--ink); font-family:"Segoe UI", system-ui, sans-serif; line-height:1.5;}
  .wrap{max-width:820px; margin:0 auto; padding:40px 20px;}
  h1{font-size:1.5rem; margin:0 0 24px;}
  .gate{max-width:340px; margin:80px auto; background:#fff; padding:28px; border-radius:var(--radius); box-shadow:0 8px 24px rgba(0,0,0,.08);}
  .gate input{width:100%; padding:.7em .8em; border:1px solid var(--line); border-radius:8px; margin-bottom:12px; font-size:.95rem;}
  .gate button, .toolbar button{padding:.6em 1.2em; border-radius:8px; border:none; background:var(--accent-deep); color:#fff; font-weight:600; cursor:pointer;}
  .toolbar{display:flex; gap:10px; margin-bottom:20px;}
  .toolbar button.secondary{background:var(--surface-raised); color:var(--ink); border:1px solid var(--line);}
  .card{background:var(--surface-raised); border-radius:var(--radius); padding:18px 20px; margin-bottom:14px; box-shadow:0 1px 2px rgba(0,0,0,.04);}
  .card h3{margin:0 0 4px; font-size:1rem;}
  .card .meta{font-size:.8rem; color:var(--ink-soft); margin:0 0 10px;}
  .card p.text{margin:0 0 14px; font-size:.94rem;}
  .card .actions{display:flex; gap:10px;}
  .card .actions button{padding:.5em 1.1em; border-radius:8px; border:none; font-weight:600; cursor:pointer; font-size:.88rem;}
  .approve{background:#2c6e3a; color:#fff;}
  .deny{background:#a3352c; color:#fff;}
  .empty{color:var(--ink-soft); padding:20px 0;}
  .err{color:#a3352c; font-size:.88rem;}
  .spam-flag{color:#a3352c; font-weight:600;}
</style>
</head>
<body>

<div id="gate" class="gate">
  <p style="margin-top:0;">Enter admin key</p>
  <input type="password" id="keyInput" placeholder="Admin key">
  <button onclick="saveKey()">Unlock</button>
  <p class="err" id="gateErr"></p>
</div>

<div class="wrap" id="panel" style="display:none;">
  <h1>Review Moderation</h1>
  <div class="toolbar">
    <button onclick="load('pending')">Pending</button>
    <button class="secondary" onclick="load('approved')">Approved</button>
    <button class="secondary" onclick="load('denied')">Denied</button>
    <button class="secondary" onclick="load('spam')">Spam</button>
  </div>
  <div id="list"></div>
</div>

<script>
  var API = "https://themethodhome-reviews.the-method-home.workers.dev";

  function getKey(){ return sessionStorage.getItem('tmh_admin_key') || ''; }

  function saveKey(){
    var val = document.getElementById('keyInput').value.trim();
    if (!val) return;
    sessionStorage.setItem('tmh_admin_key', val);
    document.getElementById('gateErr').textContent = '';
    checkAndShow();
  }

  function checkAndShow(){
    if (!getKey()){ return; }
    document.getElementById('gate').style.display = 'none';
    document.getElementById('panel').style.display = 'block';
    load('pending');
  }

  function load(status){
    var list = document.getElementById('list');
    list.innerHTML = '<p class="empty">Loading&hellip;</p>';
    fetch(API + '/api/admin/reviews?status=' + status, {
      headers: { 'Authorization': 'Bearer ' + getKey() }
    })
    .then(function(res){
      if (res.status === 401){
        sessionStorage.removeItem('tmh_admin_key');
        document.getElementById('gate').style.display = 'block';
        document.getElementById('panel').style.display = 'none';
        document.getElementById('gateErr').textContent = 'Incorrect key.';
        throw new Error('unauthorized');
      }
      return res.json();
    })
    .then(function(data){
      var reviews = data.reviews || [];
      if (!reviews.length){
        list.innerHTML = '<p class="empty">Nothing here.</p>';
        return;
      }
      list.innerHTML = reviews.map(function(r){
        var stars = '★'.repeat(r.rating) + '☆'.repeat(5 - r.rating);
        var actions = status === 'pending'
          ? '<div class="actions">' +
              '<button class="approve" onclick="decide(' + r.id + ',\'approve\')">Approve</button>' +
              '<button class="deny" onclick="decide(' + r.id + ',\'deny\')">Deny</button>' +
            '</div>'
          : '';
        var spamNote = r.spam_score >= 5 ? '<span class="spam-flag"> • spam score ' + r.spam_score + '</span>' : '';
        return '<div class="card">' +
          '<h3>' + escapeHtml(r.name) + ' &middot; ' + r.location + ' &middot; ' + stars + '</h3>' +
          '<p class="meta">' + escapeHtml(r.email || 'no email') + ' &middot; ' + r.created_at + spamNote + '</p>' +
          '<p class="text">' + escapeHtml(r.review_text) + '</p>' +
          actions +
        '</div>';
      }).join('');
    })
    .catch(function(){});
  }

  function decide(id, action){
    fetch(API + '/api/admin/reviews/' + id + '/' + action, {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + getKey() }
    })
    .then(function(res){ return res.json(); })
    .then(function(){ load('pending'); })
    .catch(function(){ alert('Something went wrong.'); });
  }

  function escapeHtml(str){
    var div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  document.getElementById('keyInput').addEventListener('keydown', function(e){
    if (e.key === 'Enter') saveKey();
  });

  checkAndShow();
</script>

</body>
</html>
